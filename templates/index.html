<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker 3D</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom 3D CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Animated 3D Background Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container mt-5 position-relative">
        <h1 class="text-center mb-5 title-3d">💰 Personal Expense Tracker</h1>

        <!-- 3D Tilt Card: Form -->
        <div class="card tilt-card mb-5 shadow-lg">
            <div class="card-body">
                <h5 class="card-title text-white">Add New Expense</h5>
                <form action="/add" method="POST" class="row g-3">
                    <div class="col-md-3">
                        <input type="number" step="0.01" name="amount" class="form-control glass-input" placeholder="Amount ($)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="category" class="form-control glass-input" placeholder="Category" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="description" class="form-control glass-input" placeholder="Description (optional)">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-3d w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 3D Tilt Card: Table -->
        <div class="card tilt-card shadow-lg">
            <div class="card-body">
                <h5 class="card-title text-white">Recent Expenses</h5>
                <div class="table-responsive mt-3">
                    <table class="table table-dark table-hover table-glass">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for expense in expenses %}
                            <tr>
                                <td>{{ expense[1] }}</td>
                                <td class="text-success fw-bold">${{ "%.2f"|format(expense[2]) }}</td>
                                <td><span class="badge badge-3d">{{ expense[3] }}</span></td>
                                <td>{{ expense[4] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <h4 class="text-end mt-4 total-3d">Total Spent: ${{ "%.2f"|format(total) }}</h4>
            </div>
        </div>
    </div>

    <!-- Custom 3D Script -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
