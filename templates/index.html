<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">💰 Personal Expense Tracker</h1>

        <!-- Form to Add Expense -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Add New Expense</h5>
                <form action="/add" method="POST" class="row g-3">
                    <div class="col-md-3">
                        <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount ($)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="category" class="form-control" placeholder="Category (e.g., Food)" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="description" class="form-control" placeholder="Description (optional)">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Expense Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Recent Expenses</h5>
                <table class="table table-striped table-hover mt-3">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for expense in expenses %}
                        <tr>
                            <td>{{ expense[1] }}</td>
                            <td>${{ "%.2f"|format(expense[2]) }}</td>
                            <td><span class="badge bg-secondary">{{ expense[3] }}</span></td>
                            <td>{{ expense[4] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <h4 class="text-end mt-3">Total Spent: ${{ "%.2f"|format(total) }}</h4>
            </div>
        </div>
    </div>
</body>
</html>
